version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    exclude-paths:
      - "modules/samples/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15
    groups:
      all:
        exclude-patterns:
          # we aren't compatible with latest here, excluded here so that it doesn't block the other updates
          - "org.glassfish.jaxb:*"
          # uses jackson 3, we still depend on jackson 2
          - "io.swagger.core.v3:*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        dependency-type: "production"
